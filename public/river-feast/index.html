<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>River Feast</title>
<script>if (window.parent !== window) document.documentElement.classList.add('framed');</script>
<style>
:root{--ink:#2b2118;--panel:#fffaf0;--accent:#f0a83a;--good:#4caf50}
*{box-sizing:border-box}
html,body{margin:0;background:#1c1814;font-family:ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:1180px;margin:0 auto}
#stage{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:14px;background:#bfe3f2;
  user-select:none;-webkit-user-select:none;touch-action:none}
/* standalone only: when framed, the host sizes us from our reported height */
html:not(.framed) #stage{max-height:100vh;max-height:100svh}
@media (max-width:700px){#stage{aspect-ratio:3/4;border-radius:0}}
@media (max-width:560px){
  #hudL{top:auto;bottom:10px}
  .chip{font-size:13px;padding:4px 9px}
  #obj{top:46px;font-size:13px}
}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.hud{position:absolute;top:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:3;pointer-events:none}
#hudL{left:10px;top:auto;bottom:10px;max-width:calc(100% - 110px)}#hudR{right:10px;justify-content:flex-end;max-width:calc(100% - 20px)}
.chip{background:#fffaf0ee;color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:15px;
  box-shadow:0 3px 0 #0002;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.chip.money{background:linear-gradient(#6ad66f,#2f9e44);color:#fff;text-shadow:0 1px 0 #0005}
.chip.angry{background:#ffd9cf;color:#a0281e}
.bub.angry{background:#ffcfc4}
.bub.angry::after{border-top-color:#ffcfc4}
.bub.mad{box-shadow:0 0 0 3px #ff7a5c}
.chip small{font-weight:600;opacity:.6;font-size:12px}
#obj{position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:3;background:#2b2118dd;color:#fff;
  border-radius:12px;padding:7px 14px;font-weight:700;font-size:14px;pointer-events:none;max-width:86%;text-align:center}
#obj:empty{display:none}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.7);opacity:0;transition:.4s;z-index:4;
  background:#fffaf0;color:var(--ink);border-radius:18px;padding:14px 24px;text-align:center;font-weight:900;font-size:24px;
  box-shadow:0 8px 0 #0003;pointer-events:none;max-width:88%}
#banner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner small{display:block;font-weight:600;font-size:14px;opacity:.7;margin-top:4px}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border-radius:999px;padding:2px 8px 2px 5px;
  font-weight:900;font-size:13px;display:flex;gap:3px;align-items:center;box-shadow:0 3px 0 #0002;white-space:nowrap}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.front{font-size:18px;padding:4px 12px 4px 8px}
.bub.done{background:#c8f0b8}
.bub.done::after{border-top-color:#c8f0b8}
.pop{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:18px;color:#fff;
  text-shadow:0 2px 0 #0007,0 0 6px #0005;white-space:nowrap}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#ffffff33;border:3px solid #ffffff88;
  z-index:3;pointer-events:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#fffffff0;box-shadow:0 3px 0 #0003}
#btns{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3}
#btns button{border:0;background:#fffaf0dd;border-radius:10px;padding:6px 10px;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #0002}
#overlay{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:#1c1814aa;padding:16px}
#overlay[hidden]{display:none}
.card{background:var(--panel);color:var(--ink);border-radius:20px;padding:22px 26px;max-width:430px;text-align:center;box-shadow:0 10px 0 #0003}
.card h1{margin:0 0 6px;font-size:34px}
.card p{margin:8px 0;line-height:1.5;color:#5a4a3a}
.card .keys{font-size:13px;opacity:.8}
.big{background:linear-gradient(#5fd068,#3ea84a);color:#fff;border:0;border-radius:14px;padding:12px 28px;font-weight:900;font-size:19px;
  box-shadow:0 5px 0 #2b7a34;cursor:pointer;margin-top:8px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #2b7a34}
.ghost{background:none;border:0;color:#8a7a6a;text-decoration:underline;cursor:pointer;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div class="hud" id="hudL"></div>
    <div class="hud" id="hudR"></div>
    <div id="obj"></div>
    <div id="banner"></div>
    <div id="labels"></div>
    <div id="joy"><div id="knob"></div></div>
    <div id="btns"><button id="bMute" title="Sound">🔊</button><button id="bReset" title="Start over">↺</button></div>
    <div id="overlay">
      <div class="card">
        <h1>🔥 River Feast</h1>
        <p>Catch fish from the river, cook them over the fire and feed the hungry travelers. Spend what they pay to build your camp into a town.</p>
        <p class="keys">Drag anywhere to walk (or WASD / arrow keys). Stand on a tile to use it.</p>
        <button class="big" id="bPlay">Play</button><br>
        <button class="ghost" id="bNew" hidden>Start a new camp</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from './lib/three.module.min.js';

const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
const R = Math.random;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
stage.prepend(renderer.domElement);
renderer.domElement.tabIndex = 0;

const scene = new THREE.Scene();
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .95;
scene.background = new THREE.Color(0x9fd6f2);
scene.fog = new THREE.Fog(0x9fd6f2, 42, 82);
// the camera looks at the camp diagonally, for the diorama look
const CAM_YAW = Math.PI / 4;
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 220);
scene.add(new THREE.HemisphereLight(0xdcefff, 0x4f6a34, 1.25));
const sun = new THREE.DirectionalLight(0xfff0d4, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-20, right:20, top:20, bottom:-20, near:1, far:70});
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

// ------------------------------------------------------------------ helpers
const G = {
  box: new THREE.BoxGeometry(1, 1, 1),
  sph: new THREE.SphereGeometry(1, 16, 12),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 14),
  cone: new THREE.ConeGeometry(1, 1, 12),
  cone4: new THREE.ConeGeometry(1, 1, 4),
  cap: new THREE.CapsuleGeometry(0.3, 0.42, 4, 10),
  plane: new THREE.PlaneGeometry(1, 1),
  ico: new THREE.IcosahedronGeometry(1, 0),
};
const matCache = {};
function mat(color, o = {}) {
  const k = color + JSON.stringify(o);
  return matCache[k] ||= new THREE.MeshStandardMaterial({color, roughness:.72, ...o});
}
function mesh(geo, color, s, p, parent, o) {
  if (geo === G.ico || geo === G.cone4) o = {flatShading:true, ...o};
  const m = new THREE.Mesh(geo, Array.isArray(color) ? color : mat(color, o));
  m.scale.set(...s); m.position.set(...(p || [0, 0, 0]));
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
// a raised slab of ground with darker sides, so the camp sits above the grass like a diorama
function slab(color, w, d, x, z, top = 0, h = .26) {
  const c = new THREE.Color(color), side = mat(c.clone().multiplyScalar(.72).getHex()), topM = new THREE.MeshStandardMaterial({color, roughness:.95});
  const m = new THREE.Mesh(G.box, [side, side, topM, side, side, side]);
  m.scale.set(w, h, d); m.position.set(x, top - h/2, z); m.receiveShadow = true; m.castShadow = false;
  scene.add(m); return m;
}
function ground(color, w, d, x, z, y = 0.01) {
  const m = new THREE.Mesh(G.plane, new THREE.MeshStandardMaterial({color, roughness:1}));
  m.rotation.x = -Math.PI/2; m.scale.set(w, d, 1); m.position.set(x, y, z); m.receiveShadow = true;
  scene.add(m); return m;
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

// ------------------------------------------------------------------ audio
let AC = null, muted = false;
function snd(f = 440, d = 0.08, type = 'sine', v = 0.05, slide = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}

// ------------------------------------------------------------------ items
const ITEM = {
  fish:   {h:.26, icon:'🐟', sell:1, n:'Fish'},
  grilled:{h:.26, icon:'🐟', dish:1, price:3, sell:3, n:'Grilled fish'},
  log:    {h:.3,  icon:'🪵', sell:1, n:'Logs'},
  meat:   {h:.34, icon:'🥩', sell:2, n:'Meat'},
  roast:  {h:.34, icon:'🍗', dish:1, price:6, sell:6, n:'Roast'},
  wheat:  {h:.26, icon:'🌾', sell:1, n:'Wheat'},
  bread:  {h:.3,  icon:'🍞', dish:1, price:8, sell:8, n:'Bread'},
  stone:  {h:.3,  icon:'🪨', sell:2, n:'Stone'},
  ore:    {h:.28, icon:'⛏️', sell:2, n:'Iron ore'},
  ingot:  {h:.16, icon:'🔩', sell:5, n:'Iron bars'},
  sword:  {h:.13, icon:'🗡️', sell:9, n:'Swords'},
  tools:  {h:.18, icon:'🔨', sell:12, n:'Tools'},
  scroll: {h:.16, icon:'📜', sell:10, n:'Scrolls'},
  coin:   {h:.07, icon:'💵', n:'Cash'},
};
const DISHES = Object.keys(ITEM).filter(k => ITEM[k].dish);
const logMats = [mat(0x8a5a2b), mat(0xe8c48a), mat(0xe8c48a)];
function fishShape(g, body, belly, fin = body, spots = 0) {
  const u = g.userData;
  u.body = mesh(G.sph, body, [.3, .12, .14], [0, 0, 0], g);
  u.belly = mesh(G.sph, belly, [.25, .07, .11], [.02, -.05, 0], g);
  const tail = new THREE.Group(); tail.position.set(-.3, 0, 0); g.add(tail);
  u.fins = [
    mesh(G.cone4, fin, [.07, .17, .025], [-.07, .05, 0], tail), mesh(G.cone4, fin, [.07, .17, .025], [-.07, -.05, 0], tail),
    mesh(G.cone4, fin, [.1, .1, .02], [-.03, .13, 0], g), mesh(G.cone4, fin, [.05, .08, .02], [.08, -.06, .12], g), mesh(G.cone4, fin, [.05, .08, .02], [.08, -.06, -.12], g),
  ];
  u.fins[0].rotation.z = Math.PI/2 + .55; u.fins[1].rotation.z = Math.PI/2 - .55; u.fins[2].rotation.z = -.35;
  u.fins[3].rotation.x = .6; u.fins[4].rotation.x = -.6;
  for (const z of [.1, -.1]) { mesh(G.sph, 0xffffff, [.035, .035, .02], [.2, .035, z], g); mesh(G.sph, 0x111111, [.02, .02, .015], [.215, .035, z*1.12], g); }
  u.spots = [[-.1, .08, .08], [.02, .1, -.07], [-.16, .05, -.09], [.08, .09, .09], [-.05, .11, 0]].map(p => mesh(G.sph, spots || body, [.022, .022, .022], p, g));
  u.spots.forEach(m => m.visible = !!spots);
}
function recolorFish(g, sp) {
  const u = g.userData;
  u.body.material = mat(sp.body); u.belly.material = mat(sp.belly);
  u.fins.forEach(m => m.material = mat(sp.fin));
  u.spots.forEach(m => { m.visible = !!sp.spots; if (sp.spots) m.material = mat(sp.spots); });
}
function itemMesh(type) {
  const g = new THREE.Group();
  switch (type) {
    case 'log': { const m = mesh(G.cyl, logMats, [.15, .9, .15], [0, 0, 0], g); m.rotation.z = Math.PI/2; break; }
    case 'fish': fishShape(g, 0x7a8a4a, 0xe8dcb0, 0x5f6e38, 0x3a4020); break;
    case 'grilled': fishShape(g, 0xc8742a, 0xe7a35a, 0x9a5420);
      for (let i = -1; i <= 1; i++) mesh(G.box, 0x4a2410, [.03, .02, .2], [i*.09, .11, 0], g); break;
    case 'meat': mesh(G.sph, 0xc0463a, [.22, .16, .19], [0, 0, 0], g); mesh(G.cyl, 0xf3eadb, [.04, .3, .04], [.25, 0, 0], g).rotation.z = Math.PI/2; break;
    case 'roast': mesh(G.sph, 0x8e4a1c, [.22, .16, .19], [0, 0, 0], g); mesh(G.cyl, 0xf3eadb, [.04, .3, .04], [.25, 0, 0], g).rotation.z = Math.PI/2; break;
    case 'wheat': for (let i = 0; i < 3; i++) { const m = mesh(G.cyl, 0xe4bf55, [.06, .7, .06], [0, (i%2)*.06, (i-1)*.09], g); m.rotation.z = Math.PI/2; }
      mesh(G.cyl, 0x9a6a2a, [.13, .05, .13], [0, .03, 0], g).rotation.z = Math.PI/2; break;
    case 'bread': mesh(G.sph, 0xd59a4e, [.3, .14, .17], [0, 0, 0], g); for (let i = -1; i <= 1; i++) mesh(G.box, 0xf0d7a8, [.03, .03, .2], [i*.1, .12, 0], g); break;
    case 'stone': mesh(G.ico, 0x9a9da2, [.24, .17, .2], [0, 0, 0], g); mesh(G.ico, 0xb4b7bb, [.13, .1, .12], [.1, .08, .05], g); break;
    case 'ore': mesh(G.ico, 0x5a4a44, [.22, .16, .19], [0, 0, 0], g);
      for (const [x, z] of [[.08, .08], [-.1, .02], [.02, -.1]]) mesh(G.sph, 0xd9792b, [.045, .045, .045], [x, .12, z], g); break;
    case 'ingot': mesh(G.box, 0xc8ccd2, [.4, .13, .2], [0, 0, 0], g, {metalness:.7, roughness:.3}); break;
    case 'sword': mesh(G.box, 0xe4e8ee, [.62, .04, .09], [.08, 0, 0], g, {metalness:.7, roughness:.25});
      mesh(G.box, 0x8a6a2a, [.06, .06, .3], [-.24, 0, 0], g); mesh(G.box, 0x5a3a1a, [.16, .07, .07], [-.34, 0, 0], g); break;
    case 'tools': mesh(G.box, 0x8a6a3a, [.5, .06, .07], [0, 0, 0], g); mesh(G.box, 0x8f949c, [.1, .1, .26], [.22, .02, 0], g, {metalness:.6, roughness:.35}); break;
    case 'scroll': { const r = mesh(G.cyl, 0xf1e2b8, [.08, .42, .08], [0, 0, 0], g); r.rotation.z = Math.PI/2; mesh(G.box, 0xc0392b, [.05, .17, .17], [0, 0, 0], g); break; }
    case 'coin': mesh(G.box, 0x2fa84a, [.38, .065, .2], [0, 0, 0], g); mesh(G.box, 0x86e08f, [.34, .012, .16], [0, .034, 0], g); mesh(G.box, 0xf2f8ea, [.07, .072, .206], [0, 0, 0], g); break;
  }
  scene.add(g);
  return g;
}

// A stack of item meshes laid out by a function; items fly into their slot.
class Stack {
  constructor(layout, cap = 99) { this.items = []; this.layout = layout; this.cap = cap; }
  get length() { return this.items.length; }
  count(types) { return types ? this.items.filter(i => types.includes(i.type)).length : this.items.length; }
  take(types) {
    for (let i = this.items.length - 1; i >= 0; i--)
      if (!types || types.includes(this.items[i].type)) return this.items.splice(i, 1)[0];
    return null;
  }
  push(it) { it.from = it.mesh.position.clone(); it.t = 0; this.items.push(it); }
  update(dt) {
    let y = 0;
    this.items.forEach((it, i) => {
      const L = this.layout(i, it, y); y += ITEM[it.type].h * (it.size || 1);
      if (it.t < 1) {
        it.t = Math.min(1, it.t + dt * 4.5);
        const e = 1 - Math.pow(1 - it.t, 3);
        it.mesh.position.set(it.from.x + (L.x - it.from.x)*e, it.from.y + (L.y - it.from.y)*e + Math.sin(it.t*Math.PI)*1.1, it.from.z + (L.z - it.from.z)*e);
      } else it.mesh.position.set(L.x, L.y, L.z);
      it.mesh.rotation.y = L.ry || 0;
    });
  }
}
const stacks = new Set();
function newStack(layout, cap) { const s = new Stack(layout, cap); stacks.add(s); return s; }
function spawnItem(type, pos, stack, species = null, size = null) {
  const m = itemMesh(type);
  let sz = size;
  if (species != null) { const sp = SPECIES[species]; recolorFish(m, sp); sz = sp.size; }
  if (sz && sz !== 1) m.scale.setScalar(sz);
  m.position.copy(pos); stack.push({type, mesh:m, size:sz || 1});
}
function transfer(a, b, types) { const it = a.take(types); if (it) b.push(it); return it; }

// meshes flying somewhere and then disappearing
const flyers = [];
function flyAway(m, to, dur = .3, done) { flyers.push({m, from:m.position.clone(), to, t:0, dur, done}); }
const target = to => typeof to === 'function' ? to() : to;

function pileLayout(x, z, perRow = 2) {
  return (i, it) => {
    const h = ITEM[it.type].h, isLog = it.type === 'log';
    const per = isLog ? 3 : perRow*perRow, l = Math.floor(i / per), k = i % per, odd = l % 2;
    let a, b;
    if (isLog) { a = 0; b = (k - 1) * .32; }
    else { a = (k % perRow - (perRow-1)/2) * .48; b = (Math.floor(k / perRow) - (perRow-1)/2) * .42; }
    return {x: x + (odd ? b : a), y: .1 + l*h + h/2, z: z + (odd ? a : b), ry: (odd ? Math.PI/2 : 0) + (isLog ? Math.PI/2 : 0)};
  };
}

// ------------------------------------------------------------------ world
const BOUNDS = {x0:-10.3, x1:13.4, z0:-12.9, z1:13.9};
// The player may walk anywhere inside the camp or an opened region.
const AREAS = [BOUNDS];
const inRect = (r, x, z) => x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1;
const inArea = (x, z) => AREAS.some(r => inRect(r, x, z));
const boxes = [], circles = [];
const GY = -.26;   // grass level, below the slabs
ground(0x4f9e32, 160, 160, 0, 0, GY);
const campSlab = slab(0xc29a62, 25, 27.6, 1.6, 0.5);
slab(0xb98f5c, 40, 2.4, 25, 1.6, .012);
slab(0xb98f5c, 16, 1.8, 38, 3.6, .012);
slab(0xb98f5c, 1.8, 16, 2.9, 38, .012);
// river
const water = ground(0x2fb0e2, 6, 160, -13.6, 0, -.2);
water.material = new THREE.MeshStandardMaterial({color:0x2fb0e2, roughness:.15, metalness:.15});
ground(0xe8d49a, .8, 160, -10.5, 0, -.215);
ground(0xe8d49a, .8, 160, -16.7, 0, -.215);
const ripples = [];
for (let i = 0; i < 40; i++) {
  const m = new THREE.Mesh(G.plane, new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.35}));
  m.rotation.x = -Math.PI/2; m.scale.set(.08, .6 + R()*.6, 1);
  m.position.set(-16 + R()*4.8, -.19, -40 + R()*80); scene.add(m); ripples.push(m);
}
// pier by the fishing spot
for (let i = 0; i < 6; i++) mesh(G.box, i % 2 ? 0x9a6b40 : 0x8a5d36, [.5, .14, 1.8], [-12.9 + i*.52, .22, 1], scene);
[[-14.2, .2], [-14.2, 1.8], [-12.3, .2], [-12.3, 1.8]].forEach(([x, z]) => mesh(G.cyl, 0x5e3f22, [.09, .7, .09], [x, .1, z], scene));

// decorative forest (instanced) outside the camp
const FOREST = {};
{
  const spots = []; seed = 11;
  for (let n = 0; n < 4000 && spots.length < 170; n++) {
    const x = -34 + rnd()*80, z = -38 + rnd()*72;
    if (x > -11 && x < 15 && z > -14 && z < 15.2) continue;
    if (x > -18 && x < -9.6) continue;
    if (x > 13 && Math.abs(z - 1.6) < 2.6) continue;
    if (spots.some(s => Math.hypot(s[0]-x, s[1]-z) < 1.9)) continue;
    spots.push([x, z, .8 + rnd()*.6]);
  }

      const dx0 = p.x - (b.x0 - r), dx1 = (b.x1 + r) - p.x, dz0 = p.z - (b.z0 - r), dz1 = (b.z1 + r) - p.z, m = Math.min(dx0, dx1, dz0, dz1);

    }

    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), min = c.r + r;
    if (d < min && d > 1e-4) { p.x = c.x + dx/d*min; p.z = c.z + dz/d*min; }

  if (!inArea(p.x, p.z)) {
    if (inArea(p.x, prev.z)) p.z = prev.z;
    else if (inArea(prev.x, p.z)) p.x = prev.x;
    else { p.x = prev.x; p.z = prev.z; }

}

function updBoats(dt) {
  for (const b of boats) {
    let vz = 0;
    const sail = (to, sp) => { const d = to - b.z; if (Math.abs(d) < .2) return true; vz = Math.sign(d)*sp; b.z += vz*dt; return false; };
    if (b.kind === 'war') {
      // the warship sails off with the army and comes home when the campaign ends
      if (W.camp && W.camp.ships) { if (b.state !== 'gone') { if (sail(-75, 4)) b.state = 'gone'; } }
      else if (sail(-4.6, 4)) b.state = 'dock';
    } else if (b.kind === 'fish') {
      if (b.state === 'dock') { if ((b.t -= dt) <= 0) b.state = 'out'; }
      else if (b.state === 'out') { if (sail(-46, 3.4)) { b.state = 'fishing'; b.t = 5; } }
      else if (b.state === 'fishing') { if ((b.t -= dt) <= 0) { b.cargo = 8; b.state = 'home'; } }
      else if (b.state === 'home') { if (sail(-7.2, 3.4)) b.state = 'unload'; }
      else if (b.state === 'unload') {
        const pile = ST.harbor.outStack;
        if ((b.t -= dt) <= 0) {
          b.t = .18;
          if (b.cargo > 0 && pile.length < pile.cap) { spawnItem('fish', new THREE.Vector3(b.x, 1, b.z), pile, fishSpecies()); b.cargo--; snd(500, .04, 'triangle', .02); }
          else if (!b.cargo) { b.state = 'dock'; b.t = 1.5; }
        }
      }
    } else {
      if (b.state === 'dock') { if ((b.t -= dt) <= 0) b.state = 'in'; }
      else if (b.state === 'in') { if (sail(-9.6, 3)) { b.state = 'trade'; b.t = 2.5; addCash(CASH.harbor, 40 + 15*W.era, {x:-9.3, z:-9.75}); popText('+💵 trade', new THREE.Vector3(b.x, 4, b.z), '#ffe06b'); snd(880, .12, 'triangle', .05); } }
      else if (b.state === 'trade') { if ((b.t -= dt) <= 0) b.state = 'out'; }
      else if (b.state === 'out') { if (sail(70, 3)) { b.state = 'dock'; b.t = 30; } }
    }
    b.g.position.set(b.x, Math.sin(time*2 + b.x)*.06 - .26, b.z);
    if (vz) b.g.rotation.y = vz > 0 ? 0 : Math.PI;
    b.g.rotation.z = Math.sin(time*1.6 + b.z*.1)*.04;
  }
}

function moveTo(e, x, z, dt) {

}

  if (w.kind === 'treasurer') {

const padZones = {};
const CUR_ICON = {coin:'💵', log:'🪵', stone:'🪨', ingot:'🔩', tools:'🔨', scroll:'📜'};
function refreshPads() {
  for (const p of PADS) {
    if (p.hidden) continue;
    if (W.unlocked.has(p.id) || (p.region && !W.unlocked.has(p.region + 'Gate'))) {
      if (padZones[p.id]) { removeZone(padZones[p.id]); delete padZones[p.id]; }
      continue;
    }
    const after = p.after.every(a => W.unlocked.has(a));
    const ready = after && (!p.army || W.army >= p.army);
    const near = p.after.every(a => W.unlocked.has(a) || PADS.find(q => q.id === a).after?.every(b => W.unlocked.has(b)));
    if (!ready && !near) continue;
    let z = padZones[p.id];
    const label = p.army && after ? `🔒 ${p.label} · ${p.army}🛡️` : '🔒 ' + p.label;
    if (!z || z.locked !== !ready || (!ready && z.label !== label)) {
      // the second backpack shares the first one's spot; wait for it to clear
      if (PADS.some(q => q !== p && q.x === p.x && q.z === p.z && padZones[q.id] && padZones[q.id] !== z)) continue;
      if (z) removeZone(z);
      z = padZones[p.id] = addZone({kind:ready ? 'pad' : 'lock', pad:p, x:p.x, z:p.z, w:2.1, d:2.1, locked:!ready, label, icon:p.icon,
        tile: ready ? {cost:p.cost, cur:CUR_ICON[p.cur]} : {alpha:.35, size:70, label, fill:'rgba(0,0,0,.12)', stroke:'rgba(255,255,255,.5)'}});
      z.lastPaid = -1;
    }
    if (ready) {
      const paid = W.paid[p.id] || 0;
      if (z.lastPaid !== paid) {
        z.lastPaid = paid;
        drawTile(z.tc.g, p.icon, {cost:p.cost - paid, cur:CUR_ICON[p.cur], prog:paid / p.cost});
        z.tc.t.needsUpdate = true;
      }
    }
  }
}
function payPad(zn, e) {
  const p = zn.pad, paid = W.paid[p.id] || 0, rem = p.cost - paid;
  if (rem <= 0) return;
  if (p.cur === 'coin') {
    if (W.coins <= 0) { e.tick = .3; return; }
    const amt = Math.min(rem, W.coins, Math.max(1, Math.ceil(p.cost / 28)));
    W.coins -= amt; W.paid[p.id] = paid + amt; e.tick = .045;
    const m = itemMesh('coin'); m.position.set(e.pos.x, 1.6, e.pos.z);
    flyAway(m, new THREE.Vector3(p.x, .1, p.z), .25);
    snd(700 + (paid/p.cost)*500, .03, 'triangle', .025);
  } else {
    const it = e.stack.take([p.cur]);
    if (!it) { e.tick = .3; return; }
    flyAway(it.mesh, new THREE.Vector3(p.x, .1, p.z), .25);
    W.paid[p.id] = paid + 1; e.tick = .09; snd(200, .04, 'square', .03);
  }
  if (W.paid[p.id] >= p.cost) unlock(p.id, true); else refreshPads();
}
function unlock(id, anim) {
  if (W.unlocked.has(id)) return;
  W.unlocked.add(id); UNLOCK[id](anim);
  if (anim) {
    const p = PADS.find(q => q.id === id);
    if (p.x != null) { puff(p.x, p.z); popText(`${p.icon} ${p.label}!`, new THREE.Vector3(p.x, 3, p.z), '#fff'); }

      sciMetal:'Smelter, blacksmith and workshop work twice as fast.', sciWheel:'Helpers walk faster and carry more.', sciNav:'You can build a boatyard on the river.',
      sciMedicine:'Guests wait much longer before they get angry.', sciTactics:'Campaigns need fewer soldiers.'}[id]);
    snd(392, .12, 'triangle', .05, 1.5); setTimeout(() => snd(784, .2, 'triangle', .05), 120);
    save();

}

const parts = [];
function particle(color, pos, v, life, s, o = {}) {
  const m = new THREE.Mesh(G.sph, new THREE.MeshBasicMaterial({color, transparent:true, opacity:o.op || .9, depthWrite:false}));
  m.position.copy(pos); m.scale.setScalar(s); scene.add(m);
  parts.push({m, v, t:0, life, s, op:o.op || .9, ...o});
}
function puff(x, z) {
  for (let i = 0; i < 16; i++) {
    const a = R()*Math.PI*2;
    particle(0xffffff, new THREE.Vector3(x, .4, z), new THREE.Vector3(Math.cos(a)*3, 1.5 + R()*2, Math.sin(a)*3), .7, .25 + R()*.3);
  }
}
function splashAt(x, z) {
  for (let i = 0; i < 5; i++) particle(0xe8f8ff, new THREE.Vector3(x, -.12, z), new THREE.Vector3((R() - .5)*2, 2 + R()*2, (R() - .5)*2), .45, .1, {grav:1});
}
function splash() { const p = waterPt(); splashAt(p.x, p.z); }
let smokeT = 0;
function smoke(dt) {
  if ((smokeT -= dt) > 0) return; smokeT = .35;
  for (const s of smokers) particle(0xcfcfcf, new THREE.Vector3(s.x + (R() - .5)*.3, s.y, s.z), new THREE.Vector3(.2, 1, -.1), 2.2, .2, {grow:.35, op:.4});
}
function updParts(dt) {
  for (const p of [...parts]) {
    p.t += dt;
    if (p.grav) p.v.y -= 12*dt;
    p.m.position.addScaledVector(p.v, dt);
    if (p.grow) p.m.scale.setScalar(p.s + p.t*p.grow);
    p.m.material.opacity = p.op * (1 - p.t/p.life);
    if (p.t >= p.life) { scene.remove(p.m); p.m.material.dispose(); parts.splice(parts.indexOf(p), 1); }
  }
}

window.__rf = {CAMPAIGNS, revolt, get warZone() { return warZone; }, camera, scene, testIn, boxes, circles, AREAS, BOUNDS, REGIONS, W, ST, TB, CASH, LINES, BOOST, WORKER, player, table, zones, trees, rocks, nodes, workers, soldiers, boats,
  PADS, padZones, stacks, unlock, update, render, zoneAt, objective, supplyStep, obtain, regionOf, route,
  get started() { return started; }, set started(v) { started = v; }};

/* when framed (the site embeds this page), report our height so the host
   iframe can grow and there is never a nested scrollbar. Measure #app (the
   content), not document.scrollHeight, which includes the frame's own viewport. */
if (window.parent !== window) {
  const app = $('app');
  const post = () => { try { parent.postMessage({rfHeight: Math.ceil(app.getBoundingClientRect().height) + 2}, '*'); } catch (e) {} };
  new ResizeObserver(post).observe(app);
  addEventListener('load', post); post();
}
</script>
