<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildmon</title>
<style>
  @font-face { font-family: "PS"; src: url("assets/fonts/PressStart2P.ttf") format("truetype"); }
  html, body { margin: 0; height: 100%; background: #0c120c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: "PS", monospace; }
  #screen { position: relative; box-shadow: 0 0 0 4px #283828, 0 10px 40px rgba(0,0,0,.6); background: #000; }
  #screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #screen canvas#world3d { image-rendering: auto; }
  #help { color: #8aa88a; font-size: 9px; margin-top: 12px; text-align: center; line-height: 1.8; }
  /* phone controls: a thumb joystick (diagonals walk + steer) and A / B / RUN */
  #pad { display: none; }
  body.touch #help { display: none; }
  body.touch { justify-content: flex-start; padding-top: 6px; box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.touch #pad { display: flex; width: 100%; max-width: 560px; flex: 1; align-items: center; justify-content: space-between; padding: 8px 18px 18px; box-sizing: border-box; }
  body.touch.landscape #pad { position: fixed; inset: auto 0 0 0; max-width: none; flex: none; pointer-events: none; padding: 0 14px 14px; }
  body.touch.landscape #pad > * { pointer-events: auto; opacity: 0.8; }
  body.touch.landscape #stick { width: 130px; height: 130px; }
  body.touch.landscape #btns { grid-template-columns: 62px 62px; gap: 8px; }
  body.touch.landscape .btn { width: 58px; height: 58px; }
  #stick { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, #2c3e2c 0 55%, #203020 56%); border: 3px solid #3c5a3c; position: relative; touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: #9ccc9c; box-shadow: 0 3px 0 #4a7a4a; pointer-events: none; }
  #btns { display: grid; grid-template-columns: 70px 70px; grid-template-rows: 70px 46px; gap: 10px 12px; align-items: center; justify-items: center; }
  .btn { border-radius: 50%; width: 66px; height: 66px; border: 3px solid #283828; font: 14px "PS", monospace; color: #fff; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .btn.down { transform: translateY(2px); filter: brightness(1.3); }
  #bA { background: #c8302c; grid-column: 2; grid-row: 1; transform: translateY(-14px); }
  #bA.down { transform: translateY(-12px); }
  #bB { background: #2f5fd0; grid-column: 1; grid-row: 1; transform: translateY(14px); }
  #bB.down { transform: translateY(16px); }
  #bRun { grid-column: 1 / 3; grid-row: 2; width: 110px; height: 36px; border-radius: 18px; background: #3a4a3a; font-size: 10px; }
  #bRun.on { background: #e0a020; color: #201000; }
</style>
</head>
<body>
<div id="screen"><canvas id="game" width="720" height="480"></canvas></div>
<div id="pad">
  <div id="stick"><div id="knob"></div></div>
  <div id="btns"><div class="btn" id="bB">B</div><div class="btn" id="bA">A</div><div class="btn" id="bRun">RUN</div></div>
</div>
<div id="help">UP walk · DOWN back up · LEFT/RIGHT steer · Z/ENTER/SPACE talk &amp; confirm · X/ESC menu &amp; back · SHIFT run · F fly · T teleport · M mute</div>
<script>
// Phone controls: they press the same keys the keyboard does, so the game needs no special cases.
(() => {
  const key = (code, down) => dispatchEvent(new KeyboardEvent(down ? "keydown" : "keyup", { code, bubbles: true, cancelable: true }));
  const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
  function setMode() {
    document.body.classList.toggle("touch", isTouch);
    document.body.classList.toggle("landscape", isTouch && innerWidth > innerHeight);
  }
  addEventListener("resize", setMode);
  setMode();
  const ready = (fn) => document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", fn) : fn();
  ready(() => {
    const stick = document.getElementById("stick"), knob = document.getElementById("knob");
    const dirs = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    let sid = null;
    function aim(t) {
      const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      let dx = t ? t.clientX - cx : 0, dy = t ? t.clientY - cy : 0;
      const d = Math.hypot(dx, dy), max = r.width / 2 - 20;
      if (d > max) { dx *= max / d; dy *= max / d; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      const th = 18, want = { ArrowUp: dy < -th, ArrowDown: dy > th, ArrowLeft: dx < -th, ArrowRight: dx > th };
      for (const k in want) if (want[k] !== dirs[k]) { dirs[k] = want[k]; key(k, want[k]); }
    }
    stick.addEventListener("touchstart", (e) => { e.preventDefault(); const t = e.changedTouches[0]; sid = t.identifier; aim(t); }, { passive: false });
    stick.addEventListener("touchmove", (e) => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === sid) aim(t); }, { passive: false });
    const end = (e) => { for (const t of e.changedTouches) if (t.identifier === sid) { sid = null; aim(null); } };
    stick.addEventListener("touchend", end); stick.addEventListener("touchcancel", end);
    for (const [id, code] of [["bA", "KeyZ"], ["bB", "KeyX"]]) {
      const b = document.getElementById(id);
      b.addEventListener("touchstart", (e) => { e.preventDefault(); b.classList.add("down"); key(code, true); }, { passive: false });
      const up = (e) => { e.preventDefault(); b.classList.remove("down"); key(code, false); };
      b.addEventListener("touchend", up); b.addEventListener("touchcancel", up);
    }
    const run = document.getElementById("bRun"); let running = false;
    run.addEventListener("touchstart", (e) => { e.preventDefault(); running = !running; run.classList.toggle("on", running); key("ShiftLeft", running); }, { passive: false });
  });
})();
</script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "./vendor/jsm/loaders/GLTFLoader.js";
  import * as SkeletonUtils from "./vendor/jsm/utils/SkeletonUtils.js";
  window.THREE = THREE; window.GLTFLoader = GLTFLoader; window.SkeletonUtils = SkeletonUtils;
  // classic game scripts expect the globals above, so load them in order afterwards
  for (const src of ["data.js", "maps.js", "music.js", "world3d.js", "game.js"]) {
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = src + "?v=" + Date.now(); s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  }
</script>
</body>
</html>
