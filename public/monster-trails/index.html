<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monster Trails</title>
<style>
  @font-face { font-family: "PS"; src: url("assets/fonts/PressStart2P.ttf") format("truetype"); }
  html, body { margin: 0; height: 100%; background: #0c120c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column; font-family: "PS", monospace; }
  #screen { position: relative; box-shadow: 0 0 0 4px #283828, 0 10px 40px rgba(0,0,0,.6); background: #000; }
  #screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #screen canvas#world3d { image-rendering: auto; }
  #help { color: #8aa88a; font-size: 9px; margin-top: 12px; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div id="screen"><canvas id="game" width="720" height="480"></canvas></div>
<div id="help">UP walk · DOWN back up · LEFT/RIGHT steer · Z/ENTER/SPACE talk &amp; confirm · X/ESC menu &amp; back · SHIFT run · F fly · M mute</div>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "./vendor/jsm/loaders/GLTFLoader.js";
  import * as SkeletonUtils from "./vendor/jsm/utils/SkeletonUtils.js";
  window.THREE = THREE; window.GLTFLoader = GLTFLoader; window.SkeletonUtils = SkeletonUtils;
  // classic game scripts expect the globals above, so load them in order afterwards
  for (const src of ["data.js", "maps.js", "music.js", "world3d.js", "game.js"]) {
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = src + "?v=" + Date.now(); s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  }
</script>
</body>
</html>
